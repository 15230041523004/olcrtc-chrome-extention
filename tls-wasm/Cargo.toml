[package]
name = "rust-tls-wasm"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rustls TLS 1.2/1.3 client for the olcRTC Chrome extension (wasm-bindgen)"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1.14", features = ["web", "std"] }
webpki-roots = "1"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
