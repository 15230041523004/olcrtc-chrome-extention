name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run pack
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep a single public release: drop superseded tags, then recreate this one.
          gh release delete v0.2.0 --cleanup-tag --yes || true
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "olcRTC Research $GITHUB_REF_NAME" \
            --notes "Packaged Chrome extension for this research prototype.

          Unzip olcrtc-chrome-extension-*.zip and load the folder that contains manifest.json via chrome://extensions (Developer mode → Load unpacked).

          This is experimental research software (PoC). It is not a VPN, not a public proxy, and not a circumvention tool."
